services:
  - type: web
    name: continental-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3500
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
        type: secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: ""
    healthCheckPath: /health
