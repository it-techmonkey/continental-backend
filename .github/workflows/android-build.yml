name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: App_continental

      - name: Run tests
        run: flutter test
        working-directory: App_continental
        continue-on-error: true

      - name: Build APK (Release)
        run: flutter build apk --release --dart-define=MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}
        working-directory: App_continental

      - name: Build AppBundle (Release)
        run: flutter build appbundle --release --dart-define=MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}
        working-directory: App_continental

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: App_continental/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: App_continental/build/app/outputs/bundle/release/app-release.aab
